name: CI

on:
  push:
    branches: [ main, feature/java-17-downgrade ]
  pull_request:
    branches: [ main, feature/java-17-downgrade ]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read required Java version from pom.xml
        id: javaver
        run: echo "version=$(grep -oPm1 '(?<=<java.version>)[^<]+' pom.xml)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.javaver.outputs.version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build (tests skipped — SizingControllerAtlasTest needs a real Atlas connection string)
        run: ./mvnw -B package -DskipTests
