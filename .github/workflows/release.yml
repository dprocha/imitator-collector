name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: true
        default: 'main'
        type: string
      release_version:
        description: 'Artifact version to release, e.g. 1.0.0-jdk17'
        required: true
        type: string
      development_version:
        description: 'Next development version, e.g. 1.0.1-jdk17-SNAPSHOT'
        required: true
        type: string
      tag:
        description: 'Git tag for this release. Leave blank to default to v<release_version>'
        required: false
        type: string

jobs:
  release:
    name: Maven release (prepare, perform, publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read required Java version from pom.xml
        id: javaver
        run: echo "version=$(grep -oPm1 '(?<=<java.version>)[^<]+' pom.xml)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.javaver.outputs.version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Resolve tag name
        id: tagname
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v${{ inputs.release_version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Maven release:prepare
        run: |
          ./mvnw -B release:prepare \
            -DreleaseVersion=${{ inputs.release_version }} \
            -DdevelopmentVersion=${{ inputs.development_version }} \
            -Dtag=${{ steps.tagname.outputs.tag }} \
            -Darguments="-DskipTests"

      - name: Maven release:perform
        run: ./mvnw -B release:perform -Darguments="-DskipTests"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagname.outputs.tag }}
          files: target/checkout/target/*.jar
          generate_release_notes: true
